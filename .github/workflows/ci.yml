name: ci
on:
  pull_request:
  push:
    branches: [main, sandbox]

# Same commands as local. No production secret here: the tests need none (playbook: 05 - Testing and CI).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_ROOT_DOMAIN: localhost:3000
      - run: bun audit --audit-level=high
        continue-on-error: true # ponytail: make this blocking once the first audit is clean
